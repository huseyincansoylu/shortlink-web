<h1 class="text-3xl font-bold text-blue-600 p-8">{{ title() }}</h1>

<main class="max-w-xl space-y-4 px-8">
  <p class="text-sm text-gray-500">{{ links().length }} links · {{ totalClicks() }} clicks</p>

  @if (mostClicked(); as top) {
    <p class="text-sm text-gray-500">Top: /{{ top.code }}</p>
  }

  @for (link of links(); track link.code) {
    <app-link-card [link]="link" (remove)="onRemove($event)" />
  } @empty {
    <p class="text-gray-500">No links yet.</p>
  }
</main>

<router-outlet />
